# Test Suite - Feature #063 Phase 8
# Runs business logic tests with coverage reporting on every PR and push to main
# Enforces per-file coverage thresholds defined in vite.config.ts

name: Test Suite

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'frontend/tests/**'
      - 'frontend/package.json'
      - 'frontend/vite.config.ts'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'frontend/tests/**'
      - 'frontend/package.json'
      - 'frontend/vite.config.ts'

permissions:
  contents: read
  pull-requests: write # Required for PR comments

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          TZ: UTC # Timezone-independent tests (eliminates date/time flakiness)
        # Tests timeout after 2s per test file (vite.config.ts:45) - fast TDD feedback
        # If CI tests timeout, likely indicates performance regression in code

      - name: Check coverage thresholds
        run: |
          # Vitest automatically enforces thresholds from vite.config.ts
          # If any per-file threshold is not met, npm run test:coverage exits with code 1
          # No additional validation needed - thresholds already enforced above
          echo "✅ All coverage thresholds met (enforced by vite.config.ts)"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() # Upload even if tests fail (for debugging)
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 30

      - name: Comment PR with coverage summary
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');

            // Check if coverage summary exists
            const summaryPath = './frontend/coverage/coverage-summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.log('No coverage summary found - tests may have failed');
              return;
            }

            const coverage = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));

            // CRITICAL fix: Define thresholds BEFORE using them in businessLogicFiles filter
            // LOW-2 fix: Read thresholds from vite.config.ts instead of hardcoding
            const viteConfigPath = './frontend/vite.config.ts';
            let thresholds = { lines: 80, branches: 75, functions: 80, statements: 80 };

            try {
              const viteConfig = fs.readFileSync(viteConfigPath, 'utf8');
              // Extract global thresholds (simple regex - works for our config format)
              const linesMatch = viteConfig.match(/^\s+lines:\s+(\d+),/m);
              const branchesMatch = viteConfig.match(/^\s+branches:\s+(\d+),/m);
              const functionsMatch = viteConfig.match(/^\s+functions:\s+(\d+),/m);
              const statementsMatch = viteConfig.match(/^\s+statements:\s+(\d+),/m);

              if (linesMatch) thresholds.lines = parseInt(linesMatch[1]);
              if (branchesMatch) thresholds.branches = parseInt(branchesMatch[1]);
              if (functionsMatch) thresholds.functions = parseInt(functionsMatch[1]);
              if (statementsMatch) thresholds.statements = parseInt(statementsMatch[1]);
            } catch (error) {
              console.log('Could not read thresholds from vite.config.ts, using defaults');
            }

            // Get changed files in this PR with error handling (MEDIUM-2 fix)
            let changedFiles = new Set();
            let showAllFiles = false;

            try {
              const { data: prFiles } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });

              // MEDIUM-1 fix: Robust path normalization
              // Normalize paths to 'src/features/...' format for reliable matching
              changedFiles = new Set(
                prFiles.map(f => f.filename.replace(/^frontend\//, ''))
              );
            } catch (error) {
              console.error('Failed to fetch PR files:', error.message);
              console.log('Falling back to showing all coverage files');
              showAllFiles = true; // Fallback: show all files if API fails
            }

            // Format coverage table for business logic files
            const businessLogicFiles = Object.entries(coverage)
              .filter(([file]) => {
                if (!file.includes('/lib/') || file.includes('__tests__')) {
                  return false;
                }

                // If API failed, show all files
                if (showAllFiles) {
                  return true;
                }

                // Robust path matching: normalize coverage path to 'src/features/...'
                const normalizedCoveragePath = file.replace(/^.*?src\//, 'src/');
                return changedFiles.has(normalizedCoveragePath);
              })
              .sort((a, b) => a[0].localeCompare(b[0]));

            // If no changed files, show overall stats only
            const tableRows = businessLogicFiles.length > 0
              ? businessLogicFiles.map(([file, data]) => {
                  const fileName = file.split('/').pop();
                  const lines = data.lines.pct.toFixed(2);
                  const branches = data.branches.pct.toFixed(2);
                  const functions = data.functions.pct.toFixed(2);
                  const statements = data.statements.pct.toFixed(2);

                  // Highlight files below Phase 1 targets (dynamic threshold)
                  const linesIcon = parseFloat(lines) >= thresholds.lines ? '✅' : '⚠️';

                  return `| ${linesIcon} ${fileName} | ${lines}% | ${branches}% | ${functions}% | ${statements}% |`;
                }).join('\n')
              : '_No business logic files changed in this PR_';

            const overallLines = coverage.total.lines.pct.toFixed(2);
            const overallBranches = coverage.total.branches.pct.toFixed(2);
            const overallFunctions = coverage.total.functions.pct.toFixed(2);
            const overallStatements = coverage.total.statements.pct.toFixed(2);

            // thresholds already defined above (moved earlier to fix use-before-definition)
            const commentBody = [
              '## 📊 Test Coverage Report (Business Logic)',
              '',
              `Phase 1 Targets: ${thresholds.lines}% lines for business logic, 90% for financial calculations`,
              '',
              showAllFiles ? '### All Files Coverage (API fallback mode)' : '### Changed Files Coverage',
              '',
              '| File | Lines | Branches | Functions | Statements |',
              '|------|-------|----------|-----------|------------|',
              tableRows,
              '',
              '### Overall Coverage',
              '',
              '| Metric | Coverage | Phase 1 Target |',
              '|--------|----------|---------------|',
              `| Lines | ${overallLines}% | ${thresholds.lines}%+ (business logic) |`,
              `| Branches | ${overallBranches}% | ${thresholds.branches}%+ |`,
              `| Functions | ${overallFunctions}% | ${thresholds.functions}%+ |`,
              `| Statements | ${overallStatements}% | ${thresholds.statements}%+ |`,
              '',
              '**Notes**:',
              '- UI components (0% coverage) tested manually per Phase 1 requirements',
              '- Storage services show 74-75% due to browser API error paths (Phase 1 accepted limitation)',
              '- Viewing on mobile? Tables may wrap. See full HTML report in artifacts for better formatting.',
              '',
              `📦 Full coverage report available in [workflow artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            ].join('\n');

            // LOW-1 fix: Update existing comment instead of creating duplicates
            // LOW-3 fix: Add error handling for comment API calls
            try {
              const botComment = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              }).then(({ data }) => data.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('📊 Test Coverage Report')
              ));

              if (botComment) {
                // Update existing comment
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
                console.log('Updated existing coverage comment');
              } else {
                // Create new comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: commentBody
                });
                console.log('Created new coverage comment');
              }
            } catch (error) {
              console.error('Failed to post coverage comment:', error.message);
              // Don't fail workflow - commenting is informational, not critical
            }
