# Test Suite - Feature #063 Phase 8
# Runs business logic tests with coverage reporting on every PR
# Enforces per-file coverage thresholds defined in vite.config.ts

name: Test Suite

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'frontend/tests/**'
      - 'frontend/package.json'
      - 'frontend/vite.config.ts'
      - '.github/workflows/test.yml'

permissions:
  contents: read
  pull-requests: write # Required for PR comments

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          TZ: UTC

      - name: Check coverage thresholds
        run: |
          # Vitest automatically enforces thresholds from vite.config.ts
          # If any per-file threshold is not met, npm run test:coverage exits with code 1
          # No additional validation needed - thresholds already enforced above
          echo "✅ All coverage thresholds met (enforced by vite.config.ts)"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() # Upload even if tests fail (for debugging)
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 30

      - name: Comment PR with coverage summary
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');

            // Check if coverage summary exists
            const summaryPath = './frontend/coverage/coverage-summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.log('No coverage summary found - tests may have failed');
              return;
            }

            const coverage = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));

            // Get changed files in this PR (MEDIUM-1 fix: only show changed files)
            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const changedFiles = new Set(prFiles.map(f => f.filename));

            // Format coverage table for changed business logic files only
            const businessLogicFiles = Object.entries(coverage)
              .filter(([file]) => {
                // Only include business logic files that changed in this PR
                const relativePath = file.replace(/^\/.*?\//, ''); // Remove absolute path prefix
                return file.includes('/lib/') &&
                       !file.includes('__tests__') &&
                       (changedFiles.has(relativePath) || changedFiles.has('frontend/' + relativePath));
              })
              .sort((a, b) => a[0].localeCompare(b[0]));

            // If no changed files, show overall stats only
            const tableRows = businessLogicFiles.length > 0
              ? businessLogicFiles.map(([file, data]) => {
                  const fileName = file.split('/').pop();
                  const lines = data.lines.pct.toFixed(2);
                  const branches = data.branches.pct.toFixed(2);
                  const functions = data.functions.pct.toFixed(2);
                  const statements = data.statements.pct.toFixed(2);

                  // Highlight files below Phase 1 targets
                  const linesIcon = parseFloat(lines) >= 80 ? '✅' : '⚠️';

                  return `| ${linesIcon} ${fileName} | ${lines}% | ${branches}% | ${functions}% | ${statements}% |`;
                }).join('\n')
              : '_No business logic files changed in this PR_';

            const overallLines = coverage.total.lines.pct.toFixed(2);
            const overallBranches = coverage.total.branches.pct.toFixed(2);
            const overallFunctions = coverage.total.functions.pct.toFixed(2);
            const overallStatements = coverage.total.statements.pct.toFixed(2);

            const commentBody = [
              '## 📊 Test Coverage Report (Business Logic)',
              '',
              'Phase 1 Targets: 80% lines for business logic, 90% for financial calculations',
              '',
              '### Changed Files Coverage',
              '',
              '| File | Lines | Branches | Functions | Statements |',
              '|------|-------|----------|-----------|------------|',
              tableRows,
              '',
              '### Overall Coverage',
              '',
              '| Metric | Coverage | Phase 1 Target |',
              '|--------|----------|---------------|',
              `| Lines | ${overallLines}% | 80%+ (business logic) |`,
              `| Branches | ${overallBranches}% | 75%+ |`,
              `| Functions | ${overallFunctions}% | 80%+ |`,
              `| Statements | ${overallStatements}% | 80%+ |`,
              '',
              'Note: UI components (0% coverage) are tested manually per Phase 1 requirements.',
              '',
              `📦 Full coverage report available in [workflow artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            ].join('\n');

            // LOW-1 fix: Update existing comment instead of creating duplicates
            const botComment = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            }).then(({ data }) => data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📊 Test Coverage Report')
            ));

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing coverage comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('Created new coverage comment');
            }
