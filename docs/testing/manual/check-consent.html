<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Telemetry Consent</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .status {
      padding: 1rem;
      border-radius: 8px;
      margin: 1rem 0;
    }
    .unset { background: #fef3c7; border: 2px solid #f59e0b; }
    .set { background: #fee2e2; border: 2px solid #dc2626; }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-right: 0.5rem;
    }
    button:hover {
      background: #2563eb;
    }
    code {
      background: #f3f4f6;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Telemetry Consent Checker</h1>

  <div id="status" class="status"></div>

  <h2>Actions</h2>
  <button onclick="clearConsent()">Clear Consent</button>
  <button onclick="checkConsent()">Refresh Status</button>
  <button onclick="openApp()">Open Main App</button>

  <h2>Instructions</h2>
  <ol>
    <li>Click "Clear Consent" to remove the stored value</li>
    <li>Click "Open Main App" to open localhost:5173 in a new tab</li>
    <li>The telemetry banner should appear at the top</li>
  </ol>

  <script>
    const CONSENT_KEY = 'pp.telemetryConsent';

    function checkConsent() {
      const value = localStorage.getItem(CONSENT_KEY);
      const statusDiv = document.getElementById('status');

      if (value === null || value === 'unset') {
        statusDiv.className = 'status unset';
        statusDiv.innerHTML = `
          <h3>✓ Consent is UNSET</h3>
          <p>The telemetry banner SHOULD appear on the main app.</p>
          <p>Current value: <code>${value === null ? 'null (not set)' : value}</code></p>
        `;
      } else {
        statusDiv.className = 'status set';
        statusDiv.innerHTML = `
          <h3>✗ Consent is SET</h3>
          <p>The telemetry banner will NOT appear because consent is already recorded.</p>
          <p>Current value: <code>${value}</code></p>
          <p><strong>Click "Clear Consent" to reset it.</strong></p>
        `;
      }
    }

    function clearConsent() {
      localStorage.removeItem(CONSENT_KEY);
      checkConsent();
      alert('Consent cleared! Now click "Open Main App" to test.');
    }

    function openApp() {
      window.open('http://localhost:5173/', '_blank');
    }

    // Check on load
    checkConsent();
  </script>
</body>
</html>
