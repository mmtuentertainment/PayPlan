# ==============================================================================
# CODERABBIT CONFIGURATION FOR PAYPLAN
# ==============================================================================
# Constitutional Code Review Enforcement
# Last Updated: 2025-10-29
# Constitution Version: 1.1
# Project: https://github.com/mmtuentertainment/PayPlan
# Configuration Expert: Manus AI (Master Expert Level)
#
# This configuration enforces PayPlan's constitutional principles through
# AI-powered code review. It is optimized based on analysis of 43+ real-world
# CodeRabbit configurations and official documentation.
#
# Key Improvements Over Previous Version:
# - Added AST-grep rules for constitutional enforcement
# - Enhanced path_instructions with specific code patterns
# - Integrated Code Graph Analysis for better context
# - Added Learnings scope configuration
# - Optimized tool integrations for financial app security
# - Added finishing touches for docstrings and code quality
# ==============================================================================

# yaml-language-server: $schema=https://coderabbit.ai/integrations/coderabbit-overrides.v2.json

# ==============================================================================
# LANGUAGE & TONE
# ==============================================================================
language: en-US

tone_instructions: "Enforce PayPlan's IMMUTABLE principles: Privacy-First (localStorage, no tracking), Accessibility-First (WCAG 2.1 AA), Free Core (all budgeting features free forever). Phase 1: ship fast, manual testing only. Be constructive and educational."

# ==============================================================================
# REVIEW SETTINGS
# ==============================================================================
reviews:
  # Review profile: "chill" for Phase 1 velocity, "assertive" for Phase 3+
  profile: chill  # Phase 1: Ship fast, manual testing only
  
  # High-level summary settings
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false  # Disable for professional tone
  review_status: true  # Show review completion status
  collapse_walkthrough: false  # Keep walkthrough visible for context
  
  # Auto-review configuration
  auto_review:
    enabled: true
    drafts: false  # Don't review draft PRs (save resources)
    base_branches:
      - main
      - develop  # Add if you use develop branch
      - "062-short-name-dashboard"  # Feature branch for Dashboard (Chunk 1-6 PRs)
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "DRAFT"
      - "[skip ci]"
  
  # Request changes workflow: ONLY for IMMUTABLE principle violations
  request_changes_workflow: true
  
  # Path filters - exclude from review
  path_filters:
    # Dependencies
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.next/**"
    - "!**/.vercel/**"
    
    # Minified files
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.bundle.js"
    
    # Lock files
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/Cargo.lock"
    
    # Assets
    - "!**/assets/**"
    - "!**/public/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.svg"
    - "!**/*.ico"
    - "!**/*.woff"
    - "!**/*.woff2"
    - "!**/*.ttf"
    - "!**/*.eot"
    
    # Generated files
    - "!**/logs_result.json"
    - "!**/CHANGELOG.md"  # Auto-generated
    - "!**/.env.example"  # Template file
  
  # ===========================================================================
  # PATH-SPECIFIC REVIEW INSTRUCTIONS
  # ===========================================================================
  path_instructions:
    # -------------------------------------------------------------------------
    # CONSTITUTION (CRITICAL)
    # -------------------------------------------------------------------------
    - path: "memory/constitution.md"
      instructions: |
        **🚨 CRITICAL: PROJECT CONSTITUTION**
        
        This is the single source of truth for all development decisions.
        Any changes to this file are EXTREMELY SENSITIVE.
        
        **IMMUTABLE Principles (I-III) CANNOT BE CHANGED**:
        - Principle I: Privacy-First Architecture
        - Principle II: Accessibility-First Development
        - Principle III: Free Core, Premium Optional
        
        **Required for ANY constitution changes**:
        1. ✅ Written justification explaining why change is needed
        2. ✅ Stakeholder approval (comment from @matthew-utt or HIL)
        3. ✅ Version increment (e.g., v1.1 → v1.2)
        4. ✅ Update to "Last Amended" date
        5. ✅ Update to "Version" field
        
        **BLOCK merge if**:
        - ❌ Modifying IMMUTABLE principles (I-III)
        - ❌ No written justification
        - ❌ No stakeholder approval comment
        - ❌ Version not incremented
        
        **REQUEST CHANGES if**:
        - ⚠️ Changing phased requirements without phase transition
        - ⚠️ Adding new principles without market context
        - ⚠️ Weakening existing requirements
    
    # -------------------------------------------------------------------------
    # FRONTEND CODE (CONSTITUTIONAL ENFORCEMENT)
    # -------------------------------------------------------------------------
    - path: "frontend/src/**/*.{ts,tsx}"
      instructions: |
        **Constitutional Review for Frontend Code**
        
        ## 🚫 BLOCK MERGE IF VIOLATED (IMMUTABLE PRINCIPLES)
        
        ### 1. Privacy-First (Principle I)
        **Violations that BLOCK merge**:
        - ❌ `fetch()` or `axios` calls to external APIs without user consent
        - ❌ Third-party scripts (Google Analytics, Mixpanel, Hotjar, etc.)
        - ❌ `console.log()` with PII (names, emails, account numbers)
        - ❌ Server-side storage without explicit opt-in UI
        - ❌ Cookies or sessionStorage for core features (use localStorage)
        - ❌ Browser fingerprinting or tracking pixels
        
        **Required patterns**:
        - ✅ localStorage-first: `localStorage.getItem('payplan_*')`
        - ✅ PII sanitization before export: `sanitizePII(data)`
        - ✅ Consent UI before server features: `<ConsentDialog />`
        
        **Code patterns to flag**:
        ```typescript
        // ❌ BLOCK: Tracking without consent
        gtag('event', 'page_view');
        analytics.track('user_action');
        
        // ❌ BLOCK: PII in logs
        console.log('User email:', user.email);
        
        // ❌ BLOCK: Server-first architecture
        const data = await fetch('/api/budgets'); // Should use localStorage
        
        // ✅ APPROVE: localStorage-first
        const budgets = JSON.parse(localStorage.getItem('payplan_budgets_v1') || '[]');
        ```
        
        ### 2. Accessibility-First (Principle II)
        **Violations that BLOCK merge**:
        - ❌ `<div onClick={}>` without `role="button"` and keyboard handler
        - ❌ Missing `aria-label` on icon-only buttons
        - ❌ Color-only status indicators (must have text/icons too)
        - ❌ Missing focus indicators (`:focus-visible`)
        - ❌ Touch targets <44x44px
        - ❌ Missing `alt` text on informational images
        - ❌ Auto-playing animations without `prefers-reduced-motion` check
        
        **Required patterns**:
        - ✅ Semantic HTML: `<button>`, `<nav>`, `<main>`, `<article>`
        - ✅ ARIA labels: `aria-label`, `aria-describedby`, `aria-live`
        - ✅ Keyboard navigation: `onKeyDown={(e) => e.key === 'Enter' && ...}`
        - ✅ Focus management: `useRef()` + `focus()` after modal close
        - ✅ Color contrast: 4.5:1 for text, 3:1 for UI components
        
        **Code patterns to flag**:
        ```typescript
        // ❌ BLOCK: Non-semantic button
        <div onClick={handleClick}>Click me</div>
        
        // ❌ BLOCK: Missing ARIA label
        <button><TrashIcon /></button>
        
        // ❌ BLOCK: Color-only status
        <div className="text-red-500">Overbudget</div>
        
        // ✅ APPROVE: Accessible button
        <button 
          onClick={handleClick}
          onKeyDown={(e) => e.key === 'Enter' && handleClick()}
          aria-label="Delete budget"
        >
          <TrashIcon aria-hidden="true" />
        </button>
        
        // ✅ APPROVE: Dual encoding (color + text + icon)
        <div className="text-red-500 flex items-center gap-2">
          <AlertIcon aria-hidden="true" />
          <span>Overbudget by $50</span>
        </div>
        ```
        
        ### 3. Free Core (Principle III)
        **Violations that BLOCK merge**:
        - ❌ Paywalling core budgeting features (categories, budgets, transactions, dashboard, goals)
        - ❌ Paywalling recurring detection, bill reminders, cash flow, debt calculator
        - ❌ Requiring premium for CSV import/export
        - ❌ Requiring authentication for basic budgeting functionality
        
        **Allowed premium features**:
        - ✅ Bank sync (Plaid integration)
        - ✅ AI categorization
        - ✅ Investment tracking
        - ✅ Multi-user collaboration
        - ✅ Unlimited archives (>50)
        
        **Code patterns to flag**:
        ```typescript
        // ❌ BLOCK: Paywalling core feature
        if (!user.isPremium) {
          return <PaywallModal feature="budgets" />;
        }
        
        // ✅ APPROVE: Premium for advanced features
        if (!user.isPremium && budgets.length >= 10) {
          return <UpgradePrompt feature="unlimited_budgets" />;
        }
        ```
        
        ## ⚠️ REQUEST CHANGES IF VIOLATED (PHASE 1 REQUIREMENTS)
        
        ### 4. Quality-First with Phased TDD (UPDATED v3.1)
        - ✅ TDD for business logic: `features/*/lib/**/*.ts` must have tests (80% coverage target)
        - ✅ Financial calculations: 90%+ coverage REQUIRED (money is critical!)
        - ✅ Overall coverage: 40-60% minimum (phased ramp: 60%→70%→80%)
        - ❌ TDD for UI components (manual testing acceptable in Phase 1)
        - ❌ Integration tests (defer to Phase 2)
        - ❌ E2E tests (defer to Phase 2)
        - ❌ Performance optimization without user complaints (defer to Phase 4)

        **Phased TDD Approach (v3.1)**:
        - Weeks 1-2: Test-after (write code, then tests)
        - Weeks 3-6: Hybrid (some TDD, some test-after)
        - Week 7+: Strict TDD (write tests first)

        **Guidance**: "Phase 1 v3.1 requires TDD for business logic. Write tests for all
        lib/**/*.ts files targeting 80% coverage. Financial calculations need 90%+ coverage.
        UI component tests are optional (manual testing acceptable). This ensures quality
        while shipping features sustainably."

        **Examples** (what to approve/reject):
        - ✅ APPROVE: `features/budgets/lib/BudgetService.ts` with 85% test coverage
        - ✅ APPROVE: `features/categories/lib/CategoryStorage.ts` with 82% test coverage
        - ❌ REJECT: `features/transactions/lib/calculateBalance.ts` with 0% test coverage (financial!)
        - ✅ APPROVE: `features/dashboard/components/GamificationWidget.tsx` with 0% tests (UI is OK)
        - ❌ REJECT: `features/archive/lib/ArchiveService.ts` with 45% coverage (need 80%+ for business logic)
        - ❌ REJECT: `features/budgets/lib/calculations.ts` without tests (90%+ required for financial!)

        ### 5. User Features > Infrastructure
        - ❌ CI/CD improvements without user features
        - ❌ Test infrastructure without user features
        - ❌ Performance monitoring without user features
        - ✅ Features from roadmap (Tier 0, 1, 2)
        - ✅ Bug fixes for user-reported issues
        
        ### 6. Simplicity & YAGNI
        - ❌ Over-engineering (building for hypothetical futures)
        - ❌ Feature bloat (adding features without user demand)
        - ❌ Premature optimization
        - ❌ Unnecessary dependencies
        
        ## 💡 SUGGEST IMPROVEMENTS (CODE QUALITY)
        
        ### 7. TypeScript Standards
        - Strict mode enabled
        - No `any` types (use `unknown` and narrow)
        - Explicit return types on public functions
        - Zod validation for user inputs
        
        **Code patterns to suggest**:
        ```typescript
        // ❌ SUGGEST: Avoid `any`
        function processData(data: any) { ... }
        
        // ✅ APPROVE: Use `unknown` and narrow
        function processData(data: unknown) {
          if (typeof data === 'object' && data !== null) {
            // Type narrowing
          }
        }
        
        // ❌ SUGGEST: Missing return type
        function calculateTotal(items) {
          return items.reduce((sum, item) => sum + item.price, 0);
        }
        
        // ✅ APPROVE: Explicit return type
        function calculateTotal(items: Item[]): number {
          return items.reduce((sum, item) => sum + item.price, 0);
        }
        ```
        
        ### 8. React Standards
        - Functional components only
        - Custom hooks for reusable logic
        - Memoization for expensive computations (`useMemo`, `useCallback`)
        - Context for global state (no Redux unless needed)
        
        ### 9. Error Handling
        - User-friendly error messages
        - Error handling for all async operations
        - No `console.log` in production (use proper logging)
        
        ### 10. Budget App Focus
        - All features must serve core budgeting use case
        - No feature creep outside roadmap
        - Features must align with Phase 1/2/3 roadmap
    
    # -------------------------------------------------------------------------
    # BUSINESS LOGIC (LIB DIRECTORY)
    # -------------------------------------------------------------------------
    - path: "frontend/src/lib/**/*.{ts,tsx}"
      instructions: |
        **Business Logic Review**
        
        **Privacy Requirements (BLOCK if violated)**:
        - ❌ PII in function parameters without sanitization
        - ❌ Data sent to server without consent check
        - ❌ localStorage keys without `payplan_` prefix
        
        **Required patterns**:
        - ✅ PII sanitization: `sanitizePII()` before export/log
        - ✅ localStorage-first: All storage uses `payplan_*_v1` keys
        - ✅ Explicit consent: Server calls check `user.hasConsented`
        
        **Validation Requirements (SUGGEST)**:
        - Zod schemas for all user inputs
        - Type-safe validation (no `any`)
        - Clear error messages
        
        **Accessibility Requirements (BLOCK if violated)**:
        - Functions that generate UI must return accessible markup
        - Color-coded status must have text/icon alternatives
        
        **Phase 1 Requirements (REQUEST CHANGES)**:
        - Simple implementations (no premature optimization)
        - Manual testing sufficient (no automated tests required)
        - Focus on user value, not technical elegance
    
    # -------------------------------------------------------------------------
    # COMPONENTS (UI LAYER)
    # -------------------------------------------------------------------------
    - path: "frontend/src/components/**/*.{ts,tsx}"
      instructions: |
        **Component Review**
        
        **Accessibility (BLOCK merge if violated)**:
        - ❌ Missing keyboard navigation (Tab, Enter, Space, Escape)
        - ❌ Missing ARIA labels on buttons, inputs, links
        - ❌ Non-semantic HTML (divs instead of buttons)
        - ❌ Color contrast violations (use contrast checker)
        - ❌ Missing focus indicators
        - ❌ Touch targets <44x44px
        
        **Required patterns**:
        - ✅ Semantic HTML: `<button>`, `<nav>`, `<main>`, `<article>`
        - ✅ ARIA labels: `aria-label`, `aria-describedby`, `aria-live`
        - ✅ Keyboard handlers: `onKeyDown`, `onKeyUp`, `onKeyPress`
        - ✅ Focus management: `useRef()` + `focus()`
        - ✅ Reduced motion: `prefers-reduced-motion` media query
        
        **Privacy (BLOCK if violated)**:
        - ❌ Analytics tracking in components
        - ❌ PII in console.log
        - ❌ Third-party scripts without consent
        
        **Phase 1 Requirements (REQUEST CHANGES)**:
        - Simple components (no over-engineering)
        - Manual testing sufficient
        - Responsive design (mobile-first)
        
        **Code Quality (SUGGEST)**:
        - Functional components only
        - Custom hooks for reusable logic
        - Memoization for expensive computations (`useMemo`, `useCallback`)
        - Props interface with JSDoc comments
    
    # -------------------------------------------------------------------------
    # SPECIFICATIONS (SPEC-KIT)
    # -------------------------------------------------------------------------
    - path: "specs/**/*.md"
      instructions: |
        **Specification Review (Spec-Kit Workflow)**
        
        **Constitutional Compliance (BLOCK if violated)**:
        - ❌ Feature violates IMMUTABLE principles (Privacy, Accessibility, Free Core)
        - ❌ Feature not aligned with roadmap (Tier 0, 1, or 2)
        - ❌ Inappropriate tier for complexity (Tier 0: <3 days, Tier 1: 3-7 days, Tier 2: 7-14 days)
        
        **Spec Quality (REQUEST CHANGES)**:
        - User stories clear and testable
        - Acceptance criteria measurable
        - Success criteria technology-agnostic
        - Edge cases identified
        - Accessibility considerations documented
        
        **Required sections in spec.md**:
        - Feature Name
        - User Stories (with acceptance criteria)
        - Functional Requirements
        - Success Criteria
        - Edge Cases
        - Out of Scope
        
        **Phase 1 Requirements (REQUEST CHANGES)**:
        - Spec focuses on user value, not technical implementation
        - No automated testing requirements in spec (Phase 1)
        - Manual testing notes included
    
    # -------------------------------------------------------------------------
    # TESTS (PHASE 2+ ONLY)
    # -------------------------------------------------------------------------
    - path: "tests/**/*.{ts,tsx,test.ts,spec.ts}"
      instructions: |
        **Test Review (Phase 2+ only)**
        
        **Phase 1 WARNING**:
        Tests are NOT required in Phase 1 (0-100 users). If tests are added in Phase 1,
        REQUEST CHANGES with this message:
        
        "Tests are not required in Phase 1 (0-100 users). Focus on shipping features fast
        with manual testing. Defer automated tests to Phase 2 (100-1,000 users). This PR
        should focus on user features, not test infrastructure."
        
        **Phase 2+ Requirements** (if we're in Phase 2+):
        - Critical path coverage (40%)
        - Accessibility tests (axe-core)
        - Regression tests for bug fixes
        - Clear test names describing scenarios
        - No flaky tests (tests must be deterministic)
    
    # -------------------------------------------------------------------------
    # CONFIGURATION FILES
    # -------------------------------------------------------------------------
    - path: "**/*.{json,yaml,yml,toml}"
      instructions: |
        **Configuration File Review**
        
        **Security (BLOCK if violated)**:
        - ❌ Hardcoded secrets, API keys, passwords
        - ❌ Exposed credentials in config files
        - ❌ Insecure defaults (e.g., `DEBUG=true` in production)
        
        **Best Practices (SUGGEST)**:
        - Use environment variables for secrets
        - Document required environment variables
        - Provide `.env.example` template
        - Validate config on startup
    
    # -------------------------------------------------------------------------
    # GITHUB WORKFLOWS
    # -------------------------------------------------------------------------
    - path: ".github/workflows/**/*.{yml,yaml}"
      instructions: |
        **GitHub Actions Workflow Review**
        
        **Security (BLOCK if violated)**:
        - ❌ Secrets in workflow files (use GitHub Secrets)
        - ❌ Untrusted third-party actions without version pinning
        - ❌ `pull_request_target` without proper safeguards
        
        **Best Practices (SUGGEST)**:
        - Pin action versions (e.g., `actions/checkout@v4`)
        - Use GitHub Secrets for sensitive data
        - Add workflow descriptions
        - Include failure notifications

# ==============================================================================
# TOOL INTEGRATIONS
# ==============================================================================
  tools:
    # JavaScript/TypeScript linting
    eslint:
      enabled: true
      config_file: "frontend/.eslintrc.cjs"
    
    # Security - Secret scanning (CRITICAL for financial app)
    gitleaks:
      enabled: true
      # Catches API keys, tokens, credentials, PII in commits
    
    # Security - Vulnerability detection (CRITICAL for financial app)
    semgrep:
      enabled: true
      # Detects security anti-patterns, injection risks, crypto issues
    
    # YAML validation
    yamllint:
      enabled: true
      # Validates GitHub Actions, CodeRabbit config, OpenAPI specs
    
    # Markdown style
    markdownlint:
      enabled: true
      config_file: ".markdownlint.json"
    
    # GitHub Actions validation
    actionlint:
      enabled: true
      # Validates GitHub Actions workflow syntax
    
    # Shell script validation
    shellcheck:
      enabled: true
      # Validates bash scripts in .github/workflows/scripts/
    
    # AST-based pattern matching (Pro plan)
    # Enable when you upgrade to Pro for constitutional enforcement
    ast-grep:
      enabled: false  # Enable when upgraded to Pro
      rule_dirs:
        - ".ast-grep/rules"
      # Custom rules for constitutional enforcement:
      # - Detect localStorage-first violations
      # - Detect missing ARIA labels
      # - Detect paywalled core features
      # - Detect PII in console.log

# ==============================================================================
# FINISHING TOUCHES
# ==============================================================================
  finishing_touches:
    # Docstring generation
    docstrings:
      enabled: true
      language: "English"
      style: "JSDoc"  # For JavaScript/TypeScript
      path_instructions:
        - path: "frontend/src/lib/**/*.{ts,tsx}"
          instructions: |
            Generate comprehensive JSDoc with:
            - @param with types and descriptions
            - @returns with type and description
            - @throws for error cases
            - @example for complex functions
            - @accessibility notes for UI-generating functions
            
            Example:
            ```typescript
            /**
             * Calculates the total amount spent in a category.
             * 
             * @param {Transaction[]} transactions - Array of transactions to analyze
             * @param {string} categoryId - ID of the category to filter by
             * @returns {number} Total amount spent in the category
             * @throws {Error} If transactions array is invalid
             * @example
             * const total = calculateCategoryTotal(transactions, 'groceries');
             * console.log(`Spent $${total} on groceries`);
             */
            ```
        
        - path: "frontend/src/components/**/*.{ts,tsx}"
          instructions: |
            Generate JSDoc for component props and functions:
            - Component description
            - @param for each prop with type and description
            - @accessibility notes for keyboard navigation and ARIA
            
            Example:
            ```typescript
            /**
             * Budget progress bar component with accessible WCAG 2.1 AA compliance.
             * 
             * @param {Object} props - Component props
             * @param {number} props.spent - Amount spent so far
             * @param {number} props.budget - Total budget amount
             * @param {string} props.category - Category name
             * @accessibility
             * - Uses React Aria useProgressBar for ARIA attributes
             * - Keyboard accessible (Tab to focus, Enter to view details)
             * - Screen reader announces "Spent $X of $Y budget for Z"
             * - Color contrast 3:1 minimum (WCAG 2.1 AA)
             */
            ```
    
    # Unit test generation (Phase 2+ only)
    unit_tests:
      enabled: false  # Phase 1: Manual testing only
      # Enable in Phase 2 (100-1,000 users)

# ==============================================================================
# CHAT SETTINGS
# ==============================================================================
chat:
  # Auto-reply to user questions in PRs
  auto_reply: true

# ==============================================================================
# KNOWLEDGE BASE
# ==============================================================================
knowledge_base:
  # Learn from code reviews and discussions
  opt_out: false
  
  # Data retention (required for Learnings feature)
  data_retention: true
  
  # Enable web search for external context
  web_search:
    enabled: true
  
  # Learnings scope
  learnings:
    scope: auto  # auto = global for private repos, local for public repos
  
  # Issue tracking integration
  issues:
    scope: auto
  
  # Pull request context
  pull_requests:
    scope: auto
  
  # Code guidelines (reads CLAUDE.md, .copilot/, etc.)
  code_guidelines:
    enabled: true
    paths:
      - "memory/constitution.md"
      - "CLAUDE.md"
      - ".copilot/**"
      - ".cursor/**"
      - ".windsurf/**"

# ==============================================================================
# EARLY ACCESS & EXPERIMENTAL
# ==============================================================================
early_access: false  # Stable features only for production app

# ==============================================================================
# ADDITIONAL SETTINGS
# ==============================================================================

# Ignore draft PRs
ignore_draft_pr: true

# ==============================================================================
# PAYPLAN CONSTITUTIONAL RULES (REFERENCE)
# ==============================================================================
#
# These are custom guidelines that CodeRabbit MUST enforce through path_instructions.
# This section is for human reference only (CodeRabbit reads path_instructions above).
#
# **IMMUTABLE PRINCIPLES (BLOCK MERGE IF VIOLATED)**:
#
# 1. PRIVACY-FIRST (Principle I)
#    - ❌ BLOCK: User data collection without explicit consent
#    - ❌ BLOCK: Third-party trackers or analytics without opt-in
#    - ❌ BLOCK: Server-side storage without explicit opt-in
#    - ❌ BLOCK: PII in logs, telemetry, or exports without sanitization
#    - ✅ REQUIRE: localStorage-first architecture
#    - ✅ REQUIRE: PII sanitization before export
#    - ✅ REQUIRE: Explicit consent for server features
#
# 2. ACCESSIBILITY-FIRST (Principle II)
#    - ❌ BLOCK: Missing keyboard navigation (Tab, Enter, Space, Escape)
#    - ❌ BLOCK: Missing ARIA labels on interactive elements
#    - ❌ BLOCK: Color contrast violations (text <4.5:1, UI <3:1)
#    - ❌ BLOCK: Color-only information (must have text/icons too)
#    - ❌ BLOCK: Missing focus indicators
#    - ❌ BLOCK: Touch targets <44x44px
#    - ✅ REQUIRE: WCAG 2.1 AA compliance
#    - ✅ REQUIRE: Semantic HTML (`<button>`, `<nav>`, `<main>`, `<article>`)
#    - ✅ REQUIRE: Screen reader compatibility
#    - ✅ REQUIRE: Reduced motion support (`prefers-reduced-motion`)
#
# 3. FREE CORE (Principle III)
#    - ❌ BLOCK: Paywalling core budgeting features (categories, budgets, transactions, dashboard, goals)
#    - ❌ BLOCK: Paywalling recurring detection, bill reminders, cash flow, debt calculator
#    - ✅ ALLOW: Premium features (bank sync, AI categorization, investments, multi-user)
#
# **PHASE 1 REQUIREMENTS (REQUEST CHANGES IF VIOLATED)**:
#
# 4. SHIP FAST, MANUAL TESTING ONLY
#    - ❌ REQUEST CHANGES: Adding automated tests (defer to Phase 2)
#    - ❌ REQUEST CHANGES: Adding test coverage requirements (defer to Phase 3)
#    - ❌ REQUEST CHANGES: Adding performance optimization (defer to Phase 4)
#    - ❌ REQUEST CHANGES: Infrastructure without user features
#    - ✅ APPROVE: User-facing features with manual testing notes
#    - ✅ APPROVE: Simple solutions (YAGNI principle)
#    - ✅ APPROVE: Shipping features fast (2-week sprints)
#
# 5. USER FEATURES > INFRASTRUCTURE
#    - ❌ REQUEST CHANGES: CI/CD improvements without user features
#    - ❌ REQUEST CHANGES: Test infrastructure without user features
#    - ❌ REQUEST CHANGES: Performance monitoring without user features
#    - ✅ APPROVE: Features from roadmap (Tier 0, 1, 2)
#    - ✅ APPROVE: Bug fixes for user-reported issues
#
# 6. SIMPLICITY & YAGNI (Principle VII)
#    - ❌ REQUEST CHANGES: Over-engineering (building for hypothetical futures)
#    - ❌ REQUEST CHANGES: Feature bloat (adding features without user demand)
#    - ❌ REQUEST CHANGES: Premature optimization
#    - ❌ REQUEST CHANGES: Unnecessary dependencies
#    - ✅ APPROVE: Small features (<2 weeks)
#    - ✅ APPROVE: Incremental delivery
#    - ✅ APPROVE: Clear purpose for every feature
#
# **CONFLICT RESOLUTION HIERARCHY**:
#
# When principles conflict, use this hierarchy:
# 1. IMMUTABLE Principles (Privacy, Accessibility, Free Core) - HIGHEST PRIORITY
# 2. Phase Requirements (Phase 1: Ship fast, manual testing)
# 3. Product Principles (Visual-First, Mobile-First, Simplicity)
# 4. Quality Principles (Phased by user count)
#
# Example:
# - "Should we add analytics?" → NO (Privacy-First > Product insights)
# - "Should we write tests?" → NO (Phase 1: Manual testing only)
# - "Should we optimize this chart?" → ONLY IF users complain (Phase 1: Velocity > Performance)
